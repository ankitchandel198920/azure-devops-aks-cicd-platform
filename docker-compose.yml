services:
  backend:
    build:
      context: ./services/backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_VERSION: "local-dev"
  frontend:
    build:
      context: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
