{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-microservices
  labels:
    {{- include "microservices-app.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.secretName }}
          objectType: secret
  secretObjects:
    - secretName: microservices-runtime-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.secretName }}
          key: BACKEND_API_TOKEN
{{- end }}
