parameters:
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: resourceGroup
    type: string
  - name: aksClusterName
    type: string
  - name: keyVaultName
    type: string
  - name: namespace
    type: string
  - name: releaseName
    type: string
  - name: acrLoginServer
    type: string
  - name: imageTag
    type: string
  - name: valuesFile
    type: string

jobs:
  - deployment: Deploy_${{ parameters.environmentName }}
    displayName: "Deploy Microservices to AKS (${{ parameters.environmentName }})"
    environment: "${{ parameters.environmentName }}"
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: AzureKeyVault@2
              displayName: Fetch Runtime Configuration from Azure Key Vault
              inputs:
                azureSubscription: "${{ parameters.azureSubscription }}"
                KeyVaultName: "${{ parameters.keyVaultName }}"
                SecretsFilter: "app-telemetry-key,backend-api-token"
                RunAsPreJob: false

            - task: HelmInstaller@1
              displayName: Install Helm 3.x
              inputs:
                helmVersionToInstall: latest

            - task: AzureCLI@2
              displayName: Helm Atomic Upgrade with Rollback Guard
              inputs:
                azureSubscription: "${{ parameters.azureSubscription }}"
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  az aks get-credentials \
                    --resource-group "${{ parameters.resourceGroup }}" \
                    --name "${{ parameters.aksClusterName }}" \
                    --overwrite-existing
                  kubelogin convert-kubeconfig -l azurecli

                  kubectl create namespace "${{ parameters.namespace }}" --dry-run=client -o yaml | kubectl apply -f -

                  PREV_REV=$(helm history "${{ parameters.releaseName }}" -n "${{ parameters.namespace }}" --max 1 -o json 2>/dev/null | jq -r '.[0].revision // "0"' || echo "0")
                  echo "##vso[task.setvariable variable=previousHelmRevision;isOutput=true]$PREV_REV"

                  if ! helm upgrade --install "${{ parameters.releaseName }}" ./charts/microservices-app \
                    --namespace "${{ parameters.namespace }}" \
                    --values "${{ parameters.valuesFile }}" \
                    --set global.acrLoginServer="${{ parameters.acrLoginServer }}" \
                    --set backend.image.tag="${{ parameters.imageTag }}" \
                    --set frontend.image.tag="${{ parameters.imageTag }}" \
                    --atomic \
                    --wait \
                    --timeout 5m0s; then
                    echo "Helm upgrade failed; checking rollback status for revision $PREV_REV"
                    if [ "$PREV_REV" != "0" ]; then
                      helm rollback "${{ parameters.releaseName }}" "$PREV_REV" -n "${{ parameters.namespace }}" --wait
                    fi
                    exit 1
                  fi
