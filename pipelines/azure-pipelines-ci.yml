trigger:
  branches:
    include:
      - main

pr: none

variables:
  - group: enterprise-ci-shared-vars
  - name: IMAGE_TAG
    value: "$(Build.BuildId)-$(Build.SourceVersion)"
  - name: ACR_SERVICE_CONNECTION
    value: sc-acr-workload-identity
  - name: SONAR_SERVICE_CONNECTION
    value: sc-sonarqube-enterprise

stages:
  - stage: CI_Build_Test_Scan
    displayName: CI - Test, SonarQube, Trivy & ACR Push
    jobs:
      - template: templates/ci-build-scan.yml
        parameters:
          serviceName: orders-backend
          servicePath: services/backend
          imageName: microservices/orders-backend
          acrServiceConnection: $(ACR_SERVICE_CONNECTION)
          acrLoginServer: $(ACR_LOGIN_SERVER)
          sonarServiceConnection: $(SONAR_SERVICE_CONNECTION)
          imageTag: $(IMAGE_TAG)
          pushImage: true

      - template: templates/ci-build-scan.yml
        parameters:
          serviceName: web-frontend
          servicePath: services/frontend
          imageName: microservices/web-frontend
          acrServiceConnection: $(ACR_SERVICE_CONNECTION)
          acrLoginServer: $(ACR_LOGIN_SERVER)
          sonarServiceConnection: $(SONAR_SERVICE_CONNECTION)
          imageTag: $(IMAGE_TAG)
          pushImage: true

  - stage: Publish_Release_Manifests
    displayName: Package & Publish Helm Chart Artifact
    dependsOn: CI_Build_Test_Scan
    condition: succeeded()
    jobs:
      - job: PackageHelm
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: HelmInstaller@1
            inputs:
              helmVersionToInstall: latest
          - script: |
              helm lint ./charts/microservices-app
              helm package ./charts/microservices-app --version "1.0.$(Build.BuildId)" --app-version "$(IMAGE_TAG)" -d "$(Build.ArtifactStagingDirectory)"
            displayName: Package Versioned Helm Chart
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: helm-packages
            displayName: Publish Helm Artifact
